name: Automated long-form city-post rewrite queue

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: navar-city-rewrite-queue
  cancel-in-progress: false

jobs:
  queue:
    if: ${{ false }} # City-post system intentionally disabled
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      AGNES_API_BASE: https://apihub.agnes-ai.com/v1
      AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
      AGNES_MODEL: agnes-2.5-flash
      MIN_WORDS: "1050"
      MIN_INTERNAL_LINKS: "4"
      MAX_SIMILARITY: "0.62"
      BATCH_SIZE: "20"
      PARALLEL_WORKERS: "4"
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Process old rewrite queue manually
        run: python automation/city_rewrite_queue_parallel.py
      - name: Commit outputs
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f artifacts/city-rewrite-queue
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update automated city rewrite queue"
          git pull --rebase origin main
          git push origin main
