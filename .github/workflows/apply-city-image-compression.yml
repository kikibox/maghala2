name: Apply city image compression

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "automation/image-compression-apply-trigger.txt"

permissions:
  contents: write

concurrency:
  group: navar-city-image-compression
  cancel-in-progress: false

jobs:
  compress:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check pillow

      - name: Compress all existing city images
        run: |
          python automation/compress_city_images.py \
            --apply \
            --quality 60 \
            --compare-quality 78 \
            --report artifacts/city-content-queue/image-compression-report.json

      - name: Rebuild 50-item packages
        run: python automation/package_city_content_batches.py

      - name: Render queue status
        run: python automation/render_city_queue_status.py

      - name: Commit compressed images and references
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f artifacts/city-content-queue
          if git diff --cached --quiet; then
            echo "No compression changes to commit."
            exit 0
          fi
          git commit -m "Compress city images to WebP quality 60"
          git push origin HEAD:main

      - name: Upload compression report
        uses: actions/upload-artifact@v4
        with:
          name: city-image-compression-${{ github.run_number }}
          path: artifacts/city-content-queue/image-compression-report.json
          retention-days: 14
