name: Gemini city image quality test
on:
  push:
    branches: [main]
    paths: ["automation/city-image-test-gemini-trigger.txt"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: navar-city-image-test-gemini
  cancel-in-progress: false
jobs:
  test-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Generate one Davoudabad image with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python automation/test_gemini_city_image.py
      - name: Commit Gemini test image and status
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f artifacts/city-content-queue/test-images
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add Gemini city image quality test"
          git pull --rebase origin main
          git push origin main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gemini-city-image-test-${{ github.run_number }}
          path: artifacts/city-content-queue/test-images/
          retention-days: 14
