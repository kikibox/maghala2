name: Test explicit FTPS batch upload

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["automation/ftp-test-trigger.txt"]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FTP_HOST: ftp.navar-abyari.ir
      FTP_PORT: "21"
      FTP_USER: zzz@navar-abyari.ir
      FTP_REMOTE_DIR: wp-content/uploads/2026/09
      FTP_TLS: "true"
      FTP_TLS_VERIFY: "false"
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - name: Set up Python
        uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Test FTPS connection and ZIP upload
        id: ftps
        continue-on-error: true
        shell: bash
        run: |
          set +e
          test -n "$FTP_PASSWORD"
          if [ "$?" != "0" ]; then
            echo "ERROR: FTP_PASSWORD secret is missing" | tee artifacts-ftps-test.log
            exit 1
          fi
          python automation/upload_city_batches_ftps.py --test 2>&1 | tee artifacts-ftps-test.log
          exit "${PIPESTATUS[0]}"
      - name: Record FTPS test result
        if: always()
        shell: bash
        run: |
          set -u
          if [ "${{ steps.ftps.outcome }}" = "success" ]; then RESULT=passed; else RESULT=failed; fi
          python - "$RESULT" <<'PY'
          import json, pathlib, sys
          from datetime import datetime, timezone
          result=sys.argv[1]
          log=pathlib.Path('artifacts-ftps-test.log')
          error=log.read_text(encoding='utf-8',errors='replace')[-3000:] if log.exists() else ''
          payload={
              'status': result,
              'tested_at': datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z'),
              'host': 'ftp.navar-abyari.ir',
              'port': 21,
              'remote_dir': 'wp-content/uploads/2026/09',
              'uploaded_file': 'first ZIP batch',
              'password_recorded': False,
          }
          if result != 'passed': payload['error_tail']=error
          pathlib.Path('artifacts/ftps-test-status.json').write_text(json.dumps(payload,ensure_ascii=False)+'\n',encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/ftps-test-status.json
          git commit -m "Record FTPS upload test result"
          git push origin main
          if [ "$RESULT" != "passed" ]; then exit 1; fi
