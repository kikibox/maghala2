name: Build idempotent images-only package
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["featured-images/build_images_only.py", ".github/workflows/build-images-only.yml"]
permissions:
  contents: write
concurrency:
  group: navar-images-only-package
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python featured-images/build_images_only.py
      - name: Commit corrected package
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/navar-featured-images-only-report.json
          git add -f artifacts/navar-featured-images-only.sql.gz artifacts/navar-featured-images-only-package.zip
          git commit -m "Publish idempotent featured-images-only package"
          git pull --rebase origin main
          git push origin main
