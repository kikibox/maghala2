name: Build final multilingual SQL with featured images
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: navar-featured-final
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Build and validate final package
        run: python featured-images/build_final.py
      - name: Commit final deliverables
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f artifacts/navar-multilingual-with-featured-images.sql.gz artifacts/navar-multilingual-featured-package.zip
          git add artifacts/navar-multilingual-featured-report.json
          git commit -m "Publish multilingual SQL with 306 unique featured images"
          git pull --rebase origin main
          git push origin main
