name: Translate queued articles

on:
  workflow_dispatch:
    inputs:
      max_articles:
        description: Maximum source articles in this run
        required: false
        default: "1"
  push:
    branches: [main]
    paths: ["automation/translation-trigger.txt"]

permissions:
  contents: write

concurrency:
  group: navar-translation
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MAX_ARTICLES: ${{ inputs.max_articles || '1' }}
      AGNES_API_BASE: https://apihub.agnes-ai.com/v1
      AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
      AGNES_MODEL: agnes-2.5-flash
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Verify Agnes configuration
        run: test -n "$AGNES_API_KEY" || { echo "::error::Repository secret AGNES_API_KEY is missing"; exit 1; }
      - name: Translate one queued source
        run: python automation/run_resilient.py
      - name: Commit verified outputs
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add translations state docs/live-status.md
          git commit -m "Translate next queued article pair with Agnes"
          git pull --rebase origin main
          git push origin main
