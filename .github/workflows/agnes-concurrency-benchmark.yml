name: Agnes concurrency benchmark

on:
  workflow_dispatch:
    inputs:
      levels:
        description: 'Concurrency levels, comma separated'
        required: true
        default: '20,24,32'
      service:
        description: 'Service to benchmark'
        required: true
        type: choice
        options: [image, both, text]
        default: both
  push:
    branches: [main]
    paths:
      - '.github/workflows/agnes-concurrency-benchmark.yml'
      - 'automation/benchmark_agnes_concurrency.py'

permissions:
  contents: write

concurrency:
  group: agnes-concurrency-benchmark
  cancel-in-progress: true

env:
  AGNES_API_BASE: ${{ vars.AGNES_API_BASE || 'https://apihub.agnes-ai.com/v1' }}
  AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
  AGNES_API_KEY2: ${{ secrets.AGNES_API_KEY2 }}
  AGNES_API_KEY3: ${{ secrets.AGNES_API_KEY3 }}
  AGNES_API_KEY4: ${{ secrets.AGNES_API_KEY4 }}
  AGNES_API_KEY5: ${{ secrets.AGNES_API_KEY5 }}
  AGNES_API_KEY6: ${{ secrets.AGNES_API_KEY6 }}
  AGNES_API_KEY7: ${{ secrets.AGNES_API_KEY7 }}
  AGNES_API_KEY8: ${{ secrets.AGNES_API_KEY8 }}
  AGNES_MODEL: ${{ vars.AGNES_MODEL || 'agnes-3.0-flash' }}
  IMAGE_API_KEY: ${{ secrets.IMAGE_API_KEY || secrets.AGNES_API_KEY }}
  IMAGE_ENDPOINT: ${{ vars.IMAGE_ENDPOINT || 'https://apihub.agnes-ai.com/v1/images/generations' }}
  IMAGE_MODEL: ${{ vars.IMAGE_MODEL || 'agnes-image-2.5-flash' }}

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check pillow
      - name: Validate benchmark
        run: python -m py_compile automation/benchmark_agnes_concurrency.py
      - name: Run controlled concurrency ladder
        env:
          BENCHMARK_LEVELS: ${{ inputs.levels || '20,24,32' }}
          BENCHMARK_SERVICE: ${{ inputs.service || 'both' }}
        run: |
          args=()
          if [ "$BENCHMARK_SERVICE" = image ]; then args+=(--image-only); fi
          if [ "$BENCHMARK_SERVICE" = text ]; then args+=(--text-only); fi
          python automation/benchmark_agnes_concurrency.py "${args[@]}"
          cat artifacts/benchmarks/latest.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload benchmark report
        uses: actions/upload-artifact@v7
        with:
          name: agnes-concurrency-benchmark-${{ github.run_id }}
          path: artifacts/benchmarks/
          retention-days: 30
      - name: Persist benchmark summary
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f artifacts/benchmarks/latest.json artifacts/benchmarks/latest.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update Agnes concurrency benchmark [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
