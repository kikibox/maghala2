name: Generate Arabic Tajik and English translations

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/article-translations.yml'
      - 'automation/translate_queue.py'
      - 'automation/translate_generated_articles.py'
      - 'automation/render_article_queue_status.py'
      - 'automation/package_article_translation_batches.py'
      - 'sqlbuild/build_patch.py'
      - 'data/source_ids.txt'
  schedule:
    # Sole hourly entry point for the three-article production chain. It waits behind any
    # active strict rebuild, clears translations, then dispatches the Persian
    # queue. The article queue has no independent schedule, so this pending run
    # cannot be replaced while it waits for the shared lock.
    - cron: '20 * * * *'

permissions:
  contents: write
  actions: write

concurrency:
  # Keep one serialized writer for translations, Persian generation and strict
  # rebuilds. With generation chained below, GitHub never replaces a pending
  # translator with a second scheduled request in this group.
  group: article-content-pipeline
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
      AGNES_API_BASE: ${{ vars.AGNES_API_BASE || 'https://apihub.agnes-ai.com/v1' }}
      AGNES_MODEL: ${{ vars.AGNES_MODEL || 'agnes-3.0-flash' }}
      # One run can translate the complete output of a three-article Persian batch,
      # plus one carried-over article after a partial API failure.
      MAX_ARTICLES: '1'
      GENERATED_TRANSLATION_BATCH_SIZE: '1'
      MAX_TRANSLATION_BACKLOG_SOURCES: '4'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install translation dependencies
        run: |
          python -m pip install --disable-pip-version-check pillow
      - name: Validate translation pipeline
        run: |
          test -n "$AGNES_API_KEY"
          python -m py_compile automation/translate_queue.py automation/translate_generated_articles.py automation/render_article_queue_status.py automation/package_article_translation_batches.py sqlbuild/build_patch.py
      - name: Translate completed generated articles first
        id: generated
        shell: bash
        run: |
          mkdir -p artifacts/article-content-queue
          set +e
          python automation/translate_generated_articles.py 2>&1 | tee artifacts/article-content-queue/generated-translation-run.log
          generated_rc=${PIPESTATUS[0]}
          set -e
          echo "GENERATED_TRANSLATION_RC=$generated_rc" >> "$GITHUB_ENV"
          # Always rebuild status and packages from any languages completed
          # before an API/model failure so useful progress is not discarded.
          python automation/package_article_translation_batches.py || true
          python automation/render_article_queue_status.py || true
          if [ "$generated_rc" -ne 0 ]; then
            echo "::warning::Generated translation exited $generated_rc; partial progress and diagnostics will be committed before the job reports failure."
          fi
      - name: Preserve API capacity for generated article pipeline
        shell: bash
        run: |
          echo "Legacy WordPress translation queue is deferred while the generated Persian article pipeline is active."
          echo "This prevents the legacy queue from exhausting the shared Agnes free-tier request quota."
      - name: Build SQL when every language is complete
        shell: bash
        run: |
          sources=$(grep -cve '^[[:space:]]*$' data/source_ids.txt)
          english=$(find translations -mindepth 2 -maxdepth 2 -name 'en-US.json' | wc -l)
          echo "source_articles=$sources english_ready=$english"
          if [ "$english" -eq "$sources" ]; then
            python sqlbuild/build_patch.py
          else
            echo "English queue is incomplete; SQL build deferred."
          fi
      - name: Persist translation state
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add translations state docs
          git add -A artifacts/article-content-queue/translations artifacts/article-content-queue/translation-sql artifacts/article-content-queue/translation-rollback 2>/dev/null || true
          git add -f artifacts/article-content-queue/translation-status.json artifacts/article-content-queue/create-all-translations.sql artifacts/article-content-queue/rollback-all-translations.sql artifacts/article-content-queue/STATUS.md artifacts/article-content-queue/status.json 2>/dev/null || true
          git add -f artifacts/article-content-queue/translation-packages/*.zip artifacts/article-content-queue/translation-packages/manifest.json 2>/dev/null || true
          git add -f artifacts/generated-translations* artifacts/generated-english-translations* artifacts/fix-imported-translations* 2>/dev/null || true
          git add -f artifacts/article-content-queue/generated-translation-run.log artifacts/article-content-queue/legacy-translation-run.log 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          state_dir="$(mktemp -d)"
          git diff --cached --name-only -z --diff-filter=ACMRT > "$state_dir/files"
          git diff --cached --name-only -z --diff-filter=D > "$state_dir/deleted"
          if [ -s "$state_dir/files" ]; then tar --null -T "$state_dir/files" -cf "$state_dir/payload.tar"; fi
          git fetch origin main
          git reset --hard origin/main
          if [ -f "$state_dir/payload.tar" ]; then tar -xf "$state_dir/payload.tar"; fi
          if [ -s "$state_dir/deleted" ]; then xargs -0 -r rm -f -- < "$state_dir/deleted"; fi
          git add translations state docs
          git add -A artifacts/article-content-queue/translations artifacts/article-content-queue/translation-sql artifacts/article-content-queue/translation-rollback 2>/dev/null || true
          git add -f artifacts/article-content-queue/translation-status.json artifacts/article-content-queue/create-all-translations.sql artifacts/article-content-queue/rollback-all-translations.sql artifacts/article-content-queue/STATUS.md artifacts/article-content-queue/status.json artifacts/article-content-queue/generated-translation-run.log artifacts/article-content-queue/legacy-translation-run.log 2>/dev/null || true
          git add -f artifacts/article-content-queue/translation-packages/*.zip artifacts/article-content-queue/translation-packages/manifest.json 2>/dev/null || true
          git add -f artifacts/generated-translations* artifacts/generated-english-translations* artifacts/fix-imported-translations* 2>/dev/null || true
          git commit -m 'Update multilingual article translations [skip ci]'
          git push origin main

      - name: Resume Persian queue below bounded translation backlog
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          python automation/translate_generated_articles.py --check-backlog
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "Translation backlog is below the safety threshold; dispatching the next Persian article batch."
            gh workflow run article-content-queue.yml --ref main
          elif [ "$rc" -eq 2 ]; then
            echo "Translation backlog remains at the safety threshold; cooling down and dispatching the next translation slice."
            sleep 60
            gh workflow run article-translations.yml --ref main
          else
            exit "$rc"
          fi
      - name: Report generated translation failure after persistence
        if: always()
        shell: bash
        run: |
          if [ "${GENERATED_TRANSLATION_RC:-0}" -ne 0 ]; then
            echo "::error::Generated translation failed after partial progress and logs were persisted."
            exit "$GENERATED_TRANSLATION_RC"
          fi