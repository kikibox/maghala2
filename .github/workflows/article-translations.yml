name: Generate Arabic Tajik and English translations

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  # Same-workflow deduplication only. Cross-workflow priority is enforced by
  # explicit waits, so GitHub never cancels a pending translator when a rebuild starts.
  group: article-translations-${{ github.ref }}
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
      AGNES_API_KEY2: ${{ secrets.AGNES_API_KEY2 }}
      AGNES_API_KEY3: ${{ secrets.AGNES_API_KEY3 }}
      AGNES_API_KEY4: ${{ secrets.AGNES_API_KEY4 }}
      AGNES_API_KEY5: ${{ secrets.AGNES_API_KEY5 }}
      AGNES_API_KEY6: ${{ secrets.AGNES_API_KEY6 }}
      AGNES_API_KEY7: ${{ secrets.AGNES_API_KEY7 }}
      AGNES_API_KEY8: ${{ secrets.AGNES_API_KEY8 }}
      AGNES_API_KEY9: ${{ secrets.AGNES_API_KEY9 }}
      AGNES_API_KEY10: ${{ secrets.AGNES_API_KEY10 }}
      AGNES_API_KEY11: ${{ secrets.AGNES_API_KEY11 }}
      AGNES_API_KEY12: ${{ secrets.AGNES_API_KEY12 }}
      AGNES_API_KEY13: ${{ secrets.AGNES_API_KEY13 }}
      AGNES_API_BASE: ${{ vars.AGNES_API_BASE || 'https://apihub.agnes-ai.com/v1' }}
      AGNES_MODEL: ${{ vars.AGNES_MODEL || 'agnes-3.0-flash' }}
      # Clear one sixteen-article Persian batch per slice with four source-level workers.
      # This uses only a controlled share of the fourteen-key pool and preserves city headroom.
      MAX_ARTICLES: '24'
      GENERATED_TRANSLATION_BATCH_SIZE: '24'
      MAX_TRANSLATION_BACKLOG_SOURCES: '25'
      TRANSLATION_WORKERS: '8'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Wait for higher-priority image rebuilds
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 660); do
            active="$(gh run list --workflow rebuild-all-article-images.yml --limit 30 --json status --jq '[.[] | select(.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "pending" or .status == "requested")] | length')"
            if [ "$active" -eq 0 ]; then
              echo "No image rebuild is active; translation owns the writer slot."
              exit 0
            fi
            if [ "$attempt" -eq 1 ]; then echo "Waiting for $active image rebuild run(s); this run stays active instead of being cancelled."; fi
            sleep 30
          done
          echo "::error::Image rebuild did not finish within the bounded wait."
          exit 1
      - name: Install translation dependencies
        run: |
          python -m pip install --disable-pip-version-check pillow
      - name: Validate translation pipeline
        run: |
          test -n "$AGNES_API_KEY"
          python -m py_compile automation/translate_queue.py automation/translate_generated_articles.py automation/repair_persian_article_text.py automation/render_article_queue_status.py automation/package_article_content_batches.py automation/write_new_article_batch_signal.py sqlbuild/build_patch.py
      - name: Repair legacy Persian article tails without API calls
        run: python automation/repair_persian_article_text.py
      - name: Translate completed generated articles first
        id: generated
        shell: bash
        run: |
          mkdir -p artifacts/article-content-queue
          set +e
          python automation/translate_generated_articles.py 2>&1 | tee artifacts/article-content-queue/generated-translation-run.log
          generated_rc=${PIPESTATUS[0]}
          set -e
          echo "GENERATED_TRANSLATION_RC=$generated_rc" >> "$GITHUB_ENV"
          # Always rebuild status and unified packages from any languages completed
          # before an API/model failure so useful progress is not discarded.
          PACKAGE_BATCH_SIZE=50 python automation/package_article_content_batches.py || true
          python automation/render_article_queue_status.py || true
          if [ "$generated_rc" -ne 0 ]; then
            echo "::warning::Generated translation exited $generated_rc; partial progress and diagnostics will be committed before the job reports failure."
          fi
      - name: Detect newly completed unified 50-source packages
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python automation/write_new_article_batch_signal.py
          ready="$(python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('artifacts/article-content-queue');signal=root/'.new-batch-signal';packages=root/'packages';state=root/'ftps-upload-state.json'
          try: tracked=json.loads(state.read_text(encoding='utf-8')).get('files',{})
          except Exception: tracked={}
          pending=0
          if signal.exists():
            for raw in signal.read_text(encoding='utf-8').splitlines():
              name=Path(raw.strip()).name
              if not name: continue
              if not name.endswith('.zip'): name+='.zip'
              path=packages/name
              if not path.exists(): continue
              digest=hashlib.sha256(path.read_bytes()).hexdigest();previous=tracked.get(name,{})
              if previous.get('sha256')!=digest or int(previous.get('size',-1))!=path.stat().st_size: pending+=1
          print(1 if pending else 0)
          PY
          )"
          echo "NEW_ARTICLE_BATCH_READY=$ready" >> "$GITHUB_ENV"
          echo "unified_article_ftps_dispatch_ready=$ready"
      - name: Preserve API capacity for generated article pipeline
        shell: bash
        run: |
          echo "Legacy WordPress translation queue is deferred while the generated Persian article pipeline is active."
          echo "This prevents the legacy queue from exhausting the shared Agnes free-tier request quota."
      - name: Build SQL when every language is complete
        shell: bash
        run: |
          sources=$(grep -cve '^[[:space:]]*$' data/source_ids.txt)
          english=$(find translations -mindepth 2 -maxdepth 2 -name 'en-US.json' | wc -l)
          echo "source_articles=$sources english_ready=$english"
          if [ "$english" -eq "$sources" ]; then
            python sqlbuild/build_patch.py
          else
            echo "English queue is incomplete; SQL build deferred."
          fi
      - name: Persist translation state
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add translations state docs
          git add -A artifacts/article-content-queue/translations artifacts/article-content-queue/translation-sql artifacts/article-content-queue/translation-rollback 2>/dev/null || true
          git add -f artifacts/article-content-queue/translation-status.json artifacts/article-content-queue/create-all-translations.sql artifacts/article-content-queue/rollback-all-translations.sql artifacts/article-content-queue/STATUS.md artifacts/article-content-queue/status.json 2>/dev/null || true
          git add -f artifacts/article-content-queue/packages/*.zip artifacts/article-content-queue/packages/manifest.json artifacts/article-content-queue/.new-batch-signal 2>/dev/null || true
          git add -f artifacts/article-content-queue/translation-packages/*.zip artifacts/article-content-queue/translation-packages/manifest.json 2>/dev/null || true
          git add -f artifacts/generated-translations* artifacts/generated-english-translations* artifacts/fix-imported-translations* 2>/dev/null || true
          git add -f artifacts/article-content-queue/generated-translation-run.log artifacts/article-content-queue/legacy-translation-run.log 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          state_dir="$(mktemp -d)"
          git diff --cached --name-only -z --diff-filter=ACMRT > "$state_dir/files"
          git diff --cached --name-only -z --diff-filter=D > "$state_dir/deleted"
          if [ -s "$state_dir/files" ]; then tar --null -T "$state_dir/files" -cf "$state_dir/payload.tar"; fi
          git fetch origin main
          git reset --hard origin/main
          if [ -f "$state_dir/payload.tar" ]; then tar -xf "$state_dir/payload.tar"; fi
          if [ -s "$state_dir/deleted" ]; then xargs -0 -r rm -f -- < "$state_dir/deleted"; fi
          git add translations state docs
          git add -A artifacts/article-content-queue/translations artifacts/article-content-queue/translation-sql artifacts/article-content-queue/translation-rollback 2>/dev/null || true
          git add -f artifacts/article-content-queue/translation-status.json artifacts/article-content-queue/create-all-translations.sql artifacts/article-content-queue/rollback-all-translations.sql artifacts/article-content-queue/STATUS.md artifacts/article-content-queue/status.json artifacts/article-content-queue/generated-translation-run.log artifacts/article-content-queue/legacy-translation-run.log 2>/dev/null || true
          git add -f artifacts/article-content-queue/packages/*.zip artifacts/article-content-queue/packages/manifest.json artifacts/article-content-queue/.new-batch-signal 2>/dev/null || true
          git add -f artifacts/article-content-queue/translation-packages/*.zip artifacts/article-content-queue/translation-packages/manifest.json 2>/dev/null || true
          git add -f artifacts/generated-translations* artifacts/generated-english-translations* artifacts/fix-imported-translations* 2>/dev/null || true
          git commit -m 'Update multilingual article translations [skip ci]'
          git push origin main

      - name: Dispatch FTPS for newly rebuilt unified packages
        if: always() && !cancelled() && env.NEW_ARTICLE_BATCH_READY == '1'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run upload-article-batches-ftps.yml --ref main

      - name: Resume Persian queue below bounded translation backlog
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rebuild_active="$(gh run list --workflow rebuild-all-article-images.yml --limit 20 --json status --jq '[.[] | select(.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "pending" or .status == "requested")] | length')"
          if [ "$rebuild_active" -gt 0 ]; then
            echo "An image-family rebuild is queued; it owns the next pipeline handoff."
            exit 0
          fi
          set +e
          python automation/translate_generated_articles.py --check-backlog
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "Translation backlog is below the safety threshold; dispatching the next Persian article batch."
            gh workflow run article-content-queue.yml --ref main
          elif [ "$rc" -eq 2 ]; then
            echo "Translation backlog remains at the safety threshold; cooling down and dispatching the next translation slice."
            sleep 60
            gh workflow run article-translations.yml --ref main
          else
            exit "$rc"
          fi
      - name: Report generated translation failure after persistence
        if: always()
        shell: bash
        run: |
          if [ "${GENERATED_TRANSLATION_RC:-0}" -ne 0 ]; then
            echo "::error::Generated translation failed after partial progress and logs were persisted."
            exit "$GENERATED_TRANSLATION_RC"
          fi