name: Generate missing city posts and images

on:
  workflow_dispatch:
    inputs:
      mode:
        description: process, agnes-models-test, initialize, or reset
        required: false
        default: process

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: navar-city-content-queue
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    env:
      PYTHONUNBUFFERED: "1"
      GIT_TERMINAL_PROMPT: "0"

      AGNES_API_BASE: https://apihub.agnes-ai.com/v1
      AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}

      AGNES_MODEL: agnes-3.0-flash
      AGNES_IMAGE_MODEL: agnes-image-2.0-flash
      IMAGE_MODEL: agnes-image-2.0-flash

      MIN_WORDS: "1050"
      MIN_INTERNAL_LINKS: "4"

      BATCH_SIZE: "1"
      QUEUE_RUNS: "5"
      POST_DELAY_SECONDS: "10"
      POST_TIMEOUT_SECONDS: "900"
      MAX_ATTEMPTS: "2"

      IMAGE_QA_ATTEMPTS: "1"
      IMAGE_QA_MIN_SCORE: "70"
      IMAGE_QA_FAST_MODE: "1"
      IMAGE_QA_REVIEW_KINDS: "1,2,3,4,5"

      CURRENT_IMAGE_POLICY: reference-conditioned-full-scene-v19

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare diagnostics
        shell: bash
        run: |
          mkdir -p artifacts/city-content-queue
          : > artifacts/city-content-queue/run.log

          echo "event=${{ github.event_name }} sha=${{ github.sha }} text=$AGNES_MODEL image=$AGNES_IMAGE_MODEL policy=$CURRENT_IMAGE_POLICY runs=$QUEUE_RUNS delay=$POST_DELAY_SECONDS timeout=$POST_TIMEOUT_SECONDS max_attempts=$MAX_ATTEMPTS image_qa_attempts=$IMAGE_QA_ATTEMPTS image_qa_min=$IMAGE_QA_MIN_SCORE fast=$IMAGE_QA_FAST_MODE review_kinds=$IMAGE_QA_REVIEW_KINDS ftp_upload=disabled" | tee -a artifacts/city-content-queue/run.log

          test -n "$AG
