name: Generate missing city posts and images

on:
  workflow_dispatch:
    inputs:
      mode:
        description: process, initialize, reset, or agnes-models-test
        required: false
        default: process

  schedule:
    - cron: "*/7 * * * *"

permissions:
  contents: write

concurrency:
  group: navar-city-content-queue
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    env:
      PYTHONUNBUFFERED: "1"
      GIT_TERMINAL_PROMPT: "0"
      AGNES_API_BASE: https://apihub.agnes-ai.com/v1
      AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
      AGNES_MODEL: agnes-3.0-flash
      AGNES_IMAGE_MODEL: agnes-image-2.0-flash
      IMAGE_MODEL: agnes-image-2.0-flash
      BATCH_SIZE: "1"
      QUEUE_RUNS: "5"
      POST_DELAY_SECONDS: "10"
      POST_TIMEOUT_SECONDS: "900"
      CURRENT_IMAGE_POLICY: reference-conditioned-full-scene-v19

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare diagnostics
        shell: bash
        run: |
          set -e
          mkdir -p artifacts/city-content-queue
          : > artifacts/city-content-queue/run.log

          {
            echo "event=${{ github.event_name }}"
            echo "policy=$CURRENT_IMAGE_POLICY"
            echo "queue_runs=$QUEUE_RUNS"
            echo "ftp_upload=disabled"
          } | tee -a artifacts/city-content-queue/run.log

          test -n "${AGNES_API_KEY:-}" || {
            echo "ERROR: AGNES_API_KEY missing" | tee -a artifacts/city-content-queue/run.log
            exit 1
          }

          python -m py_compile \
            automation/run_agnes_city_queue_fast.py \
            automation/rebuild_city_images_preserve_posts.py \
            automation/import_permalink_fix.py \
            automation/package_city_content_batches.py \
            automation/render_city_queue_status.py

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install image tooling
        run: |
          python -m pip install --disable-pip-version-check pillow

      - name: Run queue sequentially
        shell: bash
        run: |
          set +e

          MODE="${{ github.event.inputs.mode || 'process' }}"
          echo "mode=$MODE" | tee -a artifacts/city-content-queue/run.log

          if [ "$MODE" = "initialize" ]; then
            python automation/city_content_queue.py --init-only

          elif [ "$MODE" = "reset" ]; then
            python automation/city_content_queue.py --force-init --init-only

          elif [ "$MODE" = "agnes-models-test" ]; then
            python automation/test_agnes_models.py

          else
            python automation/rebuild_city_images_preserve_posts.py \
              2>&1 | tee -a artifacts/city-content-queue/run.log

            python automation/import_permalink_fix.py \
              2>&1 | tee -a artifacts/city-content-queue/run.log

            python automation/package_city_content_batches.py \
              2>&1 | tee -a artifacts/city-content-queue/run.log

            python automation/render_city_queue_status.py

            git add -f artifacts/city-content-queue

            if ! git diff --cached --quiet; then
              git commit -m "Prepare city content queue"
              git reset
