name: Generate missing city posts and images

on:
  workflow_dispatch:

  schedule:
    - cron: "*/7 * * * *"

permissions:
  contents: write

concurrency:
  group: navar-city-content-queue
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    env:
      PYTHONUNBUFFERED: "1"
      GIT_TERMINAL_PROMPT: "0"

      AGNES_API_BASE: https://apihub.agnes-ai.com/v1
      AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}

      AGNES_MODEL: agnes-3.0-flash
      AGNES_IMAGE_MODEL: agnes-image-2.0-flash
      IMAGE_MODEL: agnes-image-2.0-flash

      FTP_HOST: ftp.navar-abyari.ir
      FTP_PORT: "21"
      FTP_USER: zzz@navar-abyari.ir
      FTP_REMOTE_DIR: /
      FTP_TLS_VERIFY: "false"
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}

      BATCH_SIZE: "1"
      CURRENT_IMAGE_POLICY: reference-conditioned-full-scene-v19

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare diagnostics
        shell: bash
        run: |
          set -e

          mkdir -p artifacts/city-content-queue
          : > artifacts/city-content-queue/run.log

          echo "event=${{ github.event_name }}" | tee -a artifacts/city-content-queue/run.log
          echo "policy=$CURRENT_IMAGE_POLICY" | tee -a artifacts/city-content-queue/run.log
          echo "batch_size=$BATCH_SIZE" | tee -a artifacts/city-content-queue/run.log
          echo "ftp_upload=enabled_after_compression" | tee -a artifacts/city-content-queue/run.log

          test -n "${AGNES_API_KEY:-}" || {
            echo "ERROR: AGNES_API_KEY missing" | tee -a artifacts/city-content-queue/run.log
            exit 1
          }

          python -m py_compile \
            automation/run_agnes_city_queue_fast.py \
            automation/import_permalink_fix.py \
            automation/package_city_content_batches.py \
            automation/render_city_queue_status.py \
            automation/upload_new_city_batches_ftps.py

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install image tooling
        run: |
          python -m pip install --disable-pip-version-check pillow

      - name: Apply one-time WebP quality 60 migration
        shell: bash
        run: |
          set -euo pipefail
          REPORT=artifacts/city-content-queue/image-compression-report.json
          if [ -f "$REPORT" ] && grep -q '"quality": 60' "$REPORT"; then
            echo "Existing image compression report confirms WebP quality 60; migration already complete."
            exit 0
          fi
          python automation/compress_city_images.py \
            --apply \
            --quality 60 \
            --compare-quality 78 \
            --report "$REPORT"
          python automation/package_city_content_batches.py
          python automation/render_city_queue_status.py

      - name: Run next queue item
        shell: bash
        run: |
          set +e

          mkdir -p artifacts/city-content-queue

          python automation/run_agnes_city_queue_fast.py \
            2>&1 | tee -a artifacts/city-content-queue/run.log

          QUEUE_CODE=${PIPESTATUS[0]}
          echo "queue_exit_code=$QUEUE_CODE" \
            | tee -a artifacts/city-content-queue/run.log

          python automation/import_permalink_fix.py || true
          python automation/package_city_content_batches.py || true
          python automation/render_city_queue_status.py || true

          git add -A artifacts/city-content-queue

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "Process next city content queue item"
          git reset --hard HEAD
          git pull --rebase --autostash origin main
          git push origin main

          exit 0

      - name: Upload new or changed batches via FTPS
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          test -n "${FTP_PASSWORD:-}" || {
            echo "ERROR: FTP_PASSWORD secret is missing"
            exit 1
          }
          python automation/upload_new_city_batches_ftps.py

          git add -f artifacts/city-content-queue/ftps-upload-state.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Record automatic FTPS batch uploads"
          git pull --rebase --autostash origin main
          git push origin main

      - name: Upload queue artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: city-content-queue-${{ github.run_number }}
          path: artifacts/city-content-queue/
          retention-days: 14
