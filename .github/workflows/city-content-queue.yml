name: Generate missing city posts and images
on:
  workflow_dispatch:
    inputs:
      mode:
        description: process, agnes-models-test, initialize, or reset
        required: false
        default: process
  issue_comment:
    types: [created]
  schedule:
    - cron: "17 */4 * * *"
  push:
    branches: [main]
    paths: ["automation/city-content-trigger.txt", "automation/rebuild_city_images_preserve_posts.py"]
permissions:
  contents: write
concurrency:
  group: navar-city-content-queue
  cancel-in-progress: true
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      PYTHONUNBUFFERED: "1"
      GIT_TERMINAL_PROMPT: "0"
      AGNES_API_BASE: https://apihub.agnes-ai.com/v1
      AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
      AGNES_MODEL: agnes-3.0-flash
      AGNES_IMAGE_MODEL: agnes-image-2.0-flash
      IMAGE_MODEL: agnes-image-2.0-flash
      MIN_WORDS: "1050"
      MIN_INTERNAL_LINKS: "4"
      BATCH_SIZE: "1"
      QUEUE_RUNS: "20"
      POST_DELAY_SECONDS: "10"
      POST_TIMEOUT_SECONDS: "900"
      MAX_ATTEMPTS: "2"
      IMAGE_QA_ATTEMPTS: "1"
      IMAGE_QA_MIN_SCORE: "70"
      IMAGE_QA_FAST_MODE: "1"
      IMAGE_QA_REVIEW_KINDS: "1,2,3,4,5"
      CURRENT_IMAGE_POLICY: reference-conditioned-full-scene-v19
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Prepare diagnostics
        shell: bash
        run: |
          mkdir -p artifacts/city-content-queue
          : > artifacts/city-content-queue/run.log
          echo "event=${{ github.event_name }} sha=${{ github.sha }} text=$AGNES_MODEL image=$AGNES_IMAGE_MODEL policy=$CURRENT_IMAGE_POLICY runs=$QUEUE_RUNS delay=$POST_DELAY_SECONDS timeout=$POST_TIMEOUT_SECONDS max_attempts=$MAX_ATTEMPTS image_qa_attempts=$IMAGE_QA_ATTEMPTS image_qa_min=$IMAGE_QA_MIN_SCORE fast=$IMAGE_QA_FAST_MODE review_kinds=$IMAGE_QA_REVIEW_KINDS ftp_upload=disabled" | tee -a artifacts/city-content-queue/run.log
          test -n "$AGNES_API_KEY" || { echo "ERROR: AGNES_API_KEY missing" | tee -a artifacts/city-content-queue/run.log; exit 1; }
          sed -i "s/ALLOWED_LATIN={'FAQ'}/ALLOWED_LATIN={'FAQ','AFP'}/" automation/reviewed_publish_city_queue.py
          sed -i "s/if x not in ALLOWED_LATIN/if x.upper() not in ALLOWED_LATIN/" automation/reviewed_publish_city_queue.py
          python -m py_compile automation/city_content_queue.py automation/city_content_queue_cloudflare.py automation/reviewed_publish_city_queue.py automation/run_agnes_city_queue.py automation/run_agnes_city_queue_seo.py automation/run_agnes_city_queue_resilient.py automation/run_agnes_city_queue_fast.py automation/agnes_json_client.py automation/research_grounding_review.py automation/city_research.py automation/image_prompt_policy.py automation/image_quality_gate.py automation/migrate_legacy_image_artifacts.py automation/reset_recent_image_outputs.py automation/import_permalink_fix.py automation/render_city_queue_status.py automation/package_city_content_batches.py automation/rebuild_city_images_preserve_posts.py automation/faq_policy.py automation/test_agnes_models.py 2>&1 | tee -a artifacts/city-content-queue/run.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check pillow 2>&1 | tee -a artifacts/city-content-queue/run.log
      - name: Run requested mode with live per-post commits
        id: queue
        shell: bash
        run: |
          set +e
          MODE="${{ github.event.inputs.mode || 'process' }}"
          if [ "${{ github.event_name }}" = "push" ]; then MODE="$(sed -n 's/^mode=//p' automation/city-content-trigger.txt | tail -1)"; fi
          if [ "${{ github.event_name }}" = "issue_comment" ]; then
            if [ -n "${{ github.event.issue.pull_request.url }}" ]; then exit 0; fi
            MODE="process"
          fi
          echo "mode=$MODE" | tee -a artifacts/city-content-queue/run.log
          if [ "$MODE" = "agnes-models-test" ]; then
            timeout --foreground "${POST_TIMEOUT_SECONDS}s" python automation/test_agnes_models.py 2>&1 | tee -a artifacts/city-content-queue/run.log
          elif [ "$MODE" = "reset" ]; then
            timeout --foreground "${POST_TIMEOUT_SECONDS}s" python automation/city_content_queue.py --force-init --init-only 2>&1 | tee -a artifacts/city-content-queue/run.log
          elif [ "$MODE" = "initialize" ]; then
            timeout --foreground "${POST_TIMEOUT_SECONDS}s" python automation/city_content_queue.py --init-only 2>&1 | tee -a artifacts/city-content-queue/run.log
          else
            python automation/rebuild_city_images_preserve_posts.py 2>&1 | tee -a artifacts/city-content-queue/run.log
            REBUILD_CODE=${PIPESTATUS[0]}
            if [ "$REBUILD_CODE" != "0" ]; then
              echo "image_rebuild_exit_code=$REBUILD_CODE" | tee -a artifacts/city-content-queue/run.log
              exit "$REBUILD_CODE"
            fi
            python automation/import_permalink_fix.py 2>&1 | tee -a artifacts/city-content-queue/run.log
            python automation/package_city_content_batches.py 2>&1 | tee -a artifacts/city-content-queue/run.log
            python automation/render_city_queue_status.py
            git add -f artifacts/city-content-queue
            if ! git diff --cached --quiet; then
              git commit -m "Rebuild existing city images without FTP upload"
              git pull --rebase origin main
              git push origin main
            fi
            for RUN_INDEX in $(seq 1 "$QUEUE_RUNS"); do
              STARTED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              echo "post_run=$RUN_INDEX/$QUEUE_RUNS started_at=$STARTED_AT" | tee -a artifacts/city-content-queue/run.log
              git add -f artifacts/city-content-queue/run.log
              if ! git diff --cached --quiet; then
                git commit -m "Start live Agnes queue run ($RUN_INDEX/20)"
                git pull --rebase origin main
                git push origin main
              fi
              timeout --foreground "${POST_TIMEOUT_SECONDS}s" python automation/run_agnes_city_queue_fast.py 2>&1 | tee -a artifacts/city-content-queue/run.log
              CODE=${PIPESTATUS[0]}
              FINISHED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              echo "post_run=$RUN_INDEX/20 finished_at=$FINISHED_AT exit_code=$CODE" | tee -a artifacts/city-content-queue/run.log
              python automation/import_permalink_fix.py 2>&1 | tee -a artifacts/city-content-queue/run.log
              python automation/package_city_content_batches.py 2>&1 | tee -a artifacts/city-content-queue/run.log
              python automation/render_city_queue_status.py
              git add -f artifacts/city-content-queue
              if ! git diff --cached --quiet; then
                git commit -m "Update live Agnes queue status ($RUN_INDEX/20)"
                git pull --rebase origin main
                git push origin main
              fi
              if [ "$CODE" != "0" ]; then echo "queue_exit_code=$CODE" | tee -a artifacts/city-content-queue/run.log; fi
              if [ "$RUN_INDEX" -lt "$QUEUE_RUNS" ]; then sleep "$POST_DELAY_SECONDS"; fi
            done
          fi
          exit 0
      - name: Commit final diagnostics
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python automation/import_permalink_fix.py 2>/dev/null || true
          python automation/package_city_content_batches.py 2>/dev/null || true
          git add -f artifacts/city-content-queue
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update Agnes reviewed city-content artifacts"
          git pull --rebase origin main
          git push origin main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: city-content-queue-${{ github.run_number }}
          path: artifacts/city-content-queue/
          retention-days: 14
