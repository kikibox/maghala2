name: City image quality comparison
on:
  push:
    branches: [main]
    paths: ["automation/city-image-test-trigger.txt"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: navar-city-image-test
  cancel-in-progress: false
jobs:
  test-images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Generate Davoudabad image with Pollinations
        env:
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
        run: python automation/test_pollinations_city_image.py
      - name: Generate Davoudabad image with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python automation/test_gemini_city_image.py
      - name: Commit comparison images and status
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f artifacts/city-content-queue/test-images
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add city image quality comparison"
          git pull --rebase origin main
          git push origin main
