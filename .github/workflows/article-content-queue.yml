# Controlled parallel mode: three articles with a shared five-image worker pool.
name: article-content-queue

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/article-content-queue.yml'
      - 'automation/article_content_queue.py'
      - 'automation/image_prompt_policy.py'
      - 'automation/image_quality_gate.py'
      - 'automation/assets/**'
      - 'automation/agnes_json_client.py'
      - 'automation/compress_article_images.py'
      - 'tests/test_article_content_queue.py'
  # No independent schedule here. The translation workflow dispatches this
  # queue only after all generated-language backlogs are current. This avoids
  # GitHub replacing the pending translation run while a long image rebuild
  # owns the shared article-content-pipeline concurrency lock.

permissions:
  contents: write
  actions: write

concurrency:
  # A skipped queue run must not acquire the production-pipeline lock first
  # and cancel the dedicated image proof triggered by the same commit.
  group: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[image-rebuild]') && 'article-content-pipeline-image-rebuild-skip' || 'article-content-pipeline' }}
  # Serialize dispatched article generation with translation and rebuild work
  # without allowing a second scheduled request to replace the pending translator.
  cancel-in-progress: false

env:
  AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
  AGNES_API_KEY2: ${{ secrets.AGNES_API_KEY2 }}
  AGNES_API_KEY3: ${{ secrets.AGNES_API_KEY3 }}
  AGNES_API_KEY4: ${{ secrets.AGNES_API_KEY4 }}
  AGNES_API_KEY5: ${{ secrets.AGNES_API_KEY5 }}
  AGNES_API_KEY6: ${{ secrets.AGNES_API_KEY6 }}
  AGNES_API_KEY7: ${{ secrets.AGNES_API_KEY7 }}
  AGNES_API_KEY8: ${{ secrets.AGNES_API_KEY8 }}
  AGNES_API_BASE: ${{ vars.AGNES_API_BASE || 'https://apihub.agnes-ai.com/v1' }}
  AGNES_MODEL: ${{ vars.AGNES_MODEL || 'agnes-3.0-flash' }}
  IMAGE_API_KEY: ${{ secrets.IMAGE_API_KEY || secrets.AGNES_API_KEY }}
  IMAGE_ENDPOINT: ${{ vars.IMAGE_ENDPOINT || 'https://apihub.agnes-ai.com/v1/images/generations' }}
  IMAGE_MODEL: ${{ vars.IMAGE_MODEL || 'agnes-image-2.5-flash' }}
  # Operational setting after the eight-key benchmark: eight articles share sixteen image workers
  # to increase throughput without a nine-request image API burst.
  # Controlled full-power ramp: both repositories share the eight-key pool.
  BATCH_SIZE: '12'
  ARTICLE_WORKERS: '12'
  IMAGE_WORKERS: '24'
  IMAGE_QA_ATTEMPTS: '6'
  IMAGE_SET_QA_ATTEMPTS: '4'
  IMAGE_QA_FAST_MODE: '0'

jobs:
  process-next-article:
    # Image-rebuild commits intentionally trigger the dedicated proof workflow.
    # Do not let this queue job cancel or compete with that strict rebuild.
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[image-rebuild]')
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Sync latest main state
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check pillow

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$AGNES_API_KEY" || { echo '::error::AGNES_API_KEY is missing'; exit 1; }

      - name: Validate Python and run tests
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile automation/article_content_queue.py automation/image_prompt_policy.py automation/image_quality_gate.py automation/rebuild_article_images_exact_product.py automation/translate_generated_articles.py automation/render_article_queue_status.py automation/compress_article_images.py automation/package_article_content_batches.py
          python -m unittest discover -s tests -p 'test_*.py'

      - name: Prioritize translation backlog
        id: translation_backlog
        shell: bash
        run: |
          set +e
          python automation/translate_generated_articles.py --check-backlog
          rc=$?
          if [ "$rc" -eq 2 ]; then
            echo "pending=1" >> "$GITHUB_OUTPUT"
            echo "Persian generation paused until all completed articles have Arabic, Tajik, and English versions."
          elif [ "$rc" -eq 0 ]; then
            echo "pending=0" >> "$GITHUB_OUTPUT"
          else
            exit "$rc"
          fi
          python automation/render_article_queue_status.py

      - name: Regenerate deterministic topics
        if: steps.translation_backlog.outputs.pending == '0'
        run: python automation/topic_matrix.py

      - name: Generate next article, images, and reversible SQL
        if: steps.translation_backlog.outputs.pending == '0'
        id: queue
        shell: bash
        run: |
          set +e
          mkdir -p artifacts/article-content-queue
          python automation/article_content_queue.py \
            2>&1 | tee artifacts/article-content-queue/run.log
          rc=${PIPESTATUS[0]}
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Optimize article images as WebP
        if: always()
        run: python automation/compress_article_images.py

      - name: Build completed 50-article packages
        if: always()
        env:
          PACKAGE_BATCH_SIZE: '50'
        run: python automation/package_article_content_batches.py

      - name: Refresh dashboard
        if: always()
        run: python automation/render_article_queue_status.py

      - name: Persist queue state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Preserve generated state, update to the latest main, then restore
          # generated files. This avoids add/add and rebase conflicts when
          # STATUS.md or another tracked state file changes during a run.
          state_dir="$(mktemp -d)"
          cp -a artifacts/article-content-queue/. "$state_dir/"
          git fetch origin main
          git reset --hard origin/main
          # Replace the tracked artifact tree rather than overlaying it so
          # migrations can actually delete legacy JPG and non-SEO duplicates.
          rm -rf artifacts/article-content-queue
          mkdir -p artifacts/article-content-queue
          cp -a "$state_dir/." artifacts/article-content-queue/
          git add -f artifacts/article-content-queue/images/* 2>/dev/null || true
          git add -f artifacts/article-content-queue/items/*.json 2>/dev/null || true
          git add -f artifacts/article-content-queue/sql/*.sql 2>/dev/null || true
          git add -f artifacts/article-content-queue/rollback/*.sql 2>/dev/null || true
          git add -f artifacts/article-content-queue/packages/*.zip 2>/dev/null || true
          git add -f artifacts/article-content-queue/run.log 2>/dev/null || true
          git add -A artifacts/article-content-queue
          if ! git diff --cached --quiet; then
            git commit -m 'Update article queue state [skip ci]'
            git push origin HEAD:main
          fi

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: article-content-queue-${{ github.run_id }}
          path: |
            artifacts/article-content-queue/
            data/article-catalog.json
          retention-days: 30

      # A transient reviewer/API failure may leave valid completed articles and
      # a preserved candidate. Keep advancing automatically after a cooldown;
      # translation-only runs remain owned by the translation workflow.
      - name: Continue article pipeline automatically
        if: always() && !cancelled()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pending="$(python - <<'PY'
          import json
          from pathlib import Path
          path = Path('artifacts/article-content-queue/status.json')
          print(int(json.loads(path.read_text(encoding='utf-8')).get('pending', 0)) if path.exists() else 0)
          PY
          )"
          if [ "${{ steps.translation_backlog.outputs.pending }}" = "1" ]; then
            echo "Translation backlog reached its bound; dispatching the translator before more Persian generation."
            gh workflow run article-translations.yml --ref main
          elif [ "$pending" -gt 0 ] && [ "${{ steps.queue.outcome }}" != "skipped" ]; then
            echo "Queue has $pending pending articles; cooling down before the next batch."
            sleep 60
            gh workflow run article-content-queue.yml --ref main
          else
            echo "No generation handoff is required from this run."
          fi

      - name: Fail run when queue processing failed
        if: steps.queue.outcome != 'skipped' && steps.queue.outputs.exit_code != '0'
        run: exit 1
