name: article-content-queue

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/article-content-queue.yml']
  schedule:
    # One article normally needs 15–22 minutes. A 30-minute cadence avoids
    # building a queue of overlapping scheduled runs.
    - cron: '*/30 * * * *'

permissions:
  contents: write

concurrency:
  group: article-content-queue
  cancel-in-progress: false

env:
  AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
  AGNES_API_BASE: ${{ vars.AGNES_API_BASE || 'https://apihub.agnes-ai.com/v1' }}
  AGNES_MODEL: ${{ vars.AGNES_MODEL || 'agnes-3.0-flash' }}
  IMAGE_MODEL: ${{ vars.IMAGE_MODEL || 'agnes-image-2.0-flash' }}
  WP_SITE_URL: https://navar-abyari.ir
  WP_USERNAME: ${{ secrets.WP_USERNAME }}
  WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
  BATCH_SIZE: '1'

jobs:
  process-next-article:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check pillow

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$AGNES_API_KEY" || { echo '::error::AGNES_API_KEY is missing'; exit 1; }
          test -n "$WP_USERNAME" || { echo '::error::WP_USERNAME is missing'; exit 1; }
          test -n "$WP_APP_PASSWORD" || { echo '::error::WP_APP_PASSWORD is missing'; exit 1; }

      - name: Validate Python and run tests
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile automation/article_content_queue.py
          python -m unittest discover -s tests -p 'test_*.py'

      - name: Regenerate deterministic topics
        run: python automation/topic_matrix.py

      - name: Generate and publish next article through WordPress REST
        id: queue
        shell: bash
        run: |
          set +e
          python automation/article_content_queue.py
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Persist queue state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u artifacts/article-content-queue
          git add artifacts/article-content-queue/STATUS.md \
                  artifacts/article-content-queue/queue.json \
                  artifacts/article-content-queue/status.json \
                  artifacts/article-content-queue/topics.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update article queue state [skip ci]'
          fi
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: article-content-queue-${{ github.run_id }}
          path: |
            artifacts/article-content-queue/
            data/article-catalog.json
          retention-days: 30

      - name: Fail run when queue processing failed
        if: steps.queue.outputs.exit_code != '0'
        run: exit 1
