name: Test city image compression

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "automation/image-compression-test-trigger.txt"
      - "automation/compress_city_images.py"
      - ".github/workflows/test-city-image-compression.yml"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check pillow

      - name: Dry-run compression test
        run: |
          python automation/compress_city_images.py \
            --dry-run \
            --quality 78 \
            --compare-quality 88 \
            --report artifacts/city-content-queue/image-compression-test.json

      - name: Commit compression report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f artifacts/city-content-queue/image-compression-test.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Record city image compression test"
          git reset --hard HEAD
          git pull --rebase --autostash origin main
          git push origin main
