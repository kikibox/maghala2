name: Same-language article link regression tests
on:
  push:
    paths:
      - 'automation/article_content_queue.py'
      - 'automation/article_link_policy.py'
      - 'automation/translation_link_policy.py'
      - 'automation/wordpress_publish_article.py'
      - 'automation/translate_queue.py'
      - 'automation/translate_generated_articles.py'
      - 'automation/translate_russian_articles.py'
      - 'tests/test_translation_link_policy.py'
      - 'tests/test_wordpress_publish_article.py'
      - 'tests/test_article_content_queue.py'
      - '.github/workflows/translation-link-policy-tests.yml'
  pull_request:
    paths:
      - 'automation/*link_policy.py'
      - 'automation/translate*.py'
      - 'tests/test_translation_link_policy.py'
      - 'tests/test_wordpress_publish_article.py'
      - 'tests/test_article_content_queue.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install Pillow
      - name: Test policy without production credentials or network
        env:
          AGNES_API_KEY: offline-test-placeholder
        run: |
          python -m unittest discover -s tests -p 'test_translation_link_policy.py'
          python -m unittest discover -s tests -p 'test_article*.py'
          python -m unittest discover -s tests -p 'test_wordpress_publish_article.py'
          python -m py_compile automation/article_content_queue.py automation/article_link_policy.py automation/translation_link_policy.py automation/translate_queue.py automation/translate_generated_articles.py automation/translate_russian_articles.py
