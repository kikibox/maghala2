name: Article pipeline hourly watchdog
on:
  workflow_dispatch:
  schedule:
    - cron: '20 * * * *'
permissions:
  contents: read
  actions: write
concurrency:
  group: article-pipeline-watchdog
  cancel-in-progress: true
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Dispatch only when the serialized pipeline is idle
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          active=0
          for workflow in article-content-queue.yml article-translations.yml rebuild-all-article-images.yml; do
            count="$(gh run list --workflow "$workflow" --limit 30 --json status --jq '[.[] | select(.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "pending" or .status == "requested")] | length')"
            active=$((active + count))
          done
          if [ "$active" -eq 0 ]; then
            echo "Article pipeline is idle; dispatching the translation gate."
            gh workflow run article-translations.yml --ref main
          else
            echo "Article pipeline already has $active active/queued run(s); watchdog is a no-op."
          fi
