name: Rebuild article images only when policy changes

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/rebuild_article_images_exact_product.py'
      - 'automation/image_prompt_policy.py'
      - 'automation/image_quality_gate.py'
      - 'automation/assets/**'

permissions:
  contents: write
  actions: write

concurrency:
  # No periodic watchdog: images already approved by the current policy are never rebuilt.
  # Strict proof runs own the real pipeline lock; queue runs marked
  # [image-rebuild] use a separate skipped-workflow lock.
  group: article-content-pipeline
  cancel-in-progress: false

env:
  AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
  AGNES_API_KEY2: ${{ secrets.AGNES_API_KEY2 }}
  AGNES_API_KEY3: ${{ secrets.AGNES_API_KEY3 }}
  AGNES_API_KEY4: ${{ secrets.AGNES_API_KEY4 }}
  AGNES_API_KEY5: ${{ secrets.AGNES_API_KEY5 }}
  AGNES_API_KEY6: ${{ secrets.AGNES_API_KEY6 }}
  AGNES_API_KEY7: ${{ secrets.AGNES_API_KEY7 }}
  AGNES_API_KEY8: ${{ secrets.AGNES_API_KEY8 }}
  AGNES_API_KEY9: ${{ secrets.AGNES_API_KEY9 }}
  AGNES_API_KEY10: ${{ secrets.AGNES_API_KEY10 }}
  AGNES_API_KEY11: ${{ secrets.AGNES_API_KEY11 }}
  AGNES_API_KEY12: ${{ secrets.AGNES_API_KEY12 }}
  AGNES_API_KEY13: ${{ secrets.AGNES_API_KEY13 }}
  AGNES_API_KEY14: ${{ secrets.AGNES_API_KEY14 }}
  AGNES_API_BASE: ${{ vars.AGNES_API_BASE || 'https://apihub.agnes-ai.com/v1' }}
  AGNES_MODEL: ${{ vars.AGNES_MODEL || 'agnes-3.0-flash' }}
  IMAGE_API_KEY: ${{ secrets.IMAGE_API_KEY || secrets.AGNES_API_KEY }}
  IMAGE_ENDPOINT: ${{ vars.IMAGE_ENDPOINT || 'https://apihub.agnes-ai.com/v1/images/generations' }}
  IMAGE_MODEL: ${{ vars.IMAGE_MODEL || 'agnes-image-2.5-flash' }}
  IMAGE_WORKERS: '3'
  IMAGE_QA_ATTEMPTS: '10'
  IMAGE_QA_REVIEW_ATTEMPTS: '4'
  API_REQUEST_ATTEMPTS: '4'
  IMAGE_SET_QA_ATTEMPTS: '4'
  IMAGE_QA_FAST_MODE: '0'
# Rebuild every completed article; two article sets run concurrently.
  IMAGE_REBUILD_POST_LIMIT: '100'

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Sync latest main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          git reset --hard origin/main
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install and validate
        run: |
          python -m pip install --disable-pip-version-check pillow
          test -n "$AGNES_API_KEY"
          python -m py_compile automation/article_content_queue.py automation/image_prompt_policy.py automation/image_quality_gate.py automation/rebuild_article_images_exact_product.py automation/compress_article_images.py automation/package_article_content_batches.py automation/render_article_queue_status.py
      - name: Rebuild next strict batch
        id: rebuild
        shell: bash
        run: |
          set +e
          mkdir -p artifacts/article-content-queue
          python automation/rebuild_article_images_exact_product.py 2>&1 | tee artifacts/article-content-queue/full-image-rebuild-v11.log
          rc=${PIPESTATUS[0]}
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Refresh optimized images, packages and dashboard
        if: always()
        run: |
          python automation/compress_article_images.py
          PACKAGE_BATCH_SIZE=50 python automation/package_article_content_batches.py
          python automation/translate_generated_articles.py --check-backlog || test "$?" -eq 2
          python automation/render_article_queue_status.py
      - name: Persist rebuilt state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          state_dir="$(mktemp -d)"
          cp -a artifacts/article-content-queue/. "$state_dir/"
          git fetch origin main
          git reset --hard origin/main
          rm -rf artifacts/article-content-queue
          mkdir -p artifacts/article-content-queue
          cp -a "$state_dir/." artifacts/article-content-queue/
          git add -f artifacts/article-content-queue/images/* 2>/dev/null || true
          git add -f artifacts/article-content-queue/items/*.json 2>/dev/null || true
          git add -f artifacts/article-content-queue/packages/*.zip 2>/dev/null || true
          git add -f artifacts/article-content-queue/full-image-rebuild-v11.log 2>/dev/null || true
          git add -A artifacts/article-content-queue
          if ! git diff --cached --quiet; then
            git commit -m 'Rebuild article images under strict v11 no-human/no-container policy [skip ci]'
            git push origin HEAD:main
          fi
      - name: Upload rebuild diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: strict-article-image-rebuild-${{ github.run_id }}
          path: artifacts/article-content-queue/
          retention-days: 30
      - name: Fail only after preserving partial progress
        if: steps.rebuild.outputs.exit_code != '0'
        run: echo "::warning::One image set was quarantined after diagnostics were preserved; the production article queue remains healthy."
      - name: Continue remaining rebuilds automatically
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          read -r remaining stalled <<<"$(python - <<'PY'
          import json
          from pathlib import Path
          path=Path('artifacts/article-content-queue/image-rebuild-reference-rerender-3d-v11-no-human-no-container-full-rebuild.json')
          data=json.loads(path.read_text(encoding='utf-8')) if path.exists() else {}
          print(int(data.get('remaining_candidates',0)), int(data.get('consecutive_no_progress_runs',0)))
          PY
          )"
          if [ "$remaining" -gt 0 ] && [ "$stalled" -lt 3 ]; then
            echo "$remaining image sets remain; dispatching the next resumable rebuild."
            sleep 20
            gh workflow run rebuild-all-article-images.yml --ref main
          elif [ "$remaining" -gt 0 ]; then
            echo "::warning::$remaining sets remain after $stalled no-progress runs; use manual dispatch after reviewing diagnostics."
          else
            echo "Strict image rebuild is complete."
          fi
