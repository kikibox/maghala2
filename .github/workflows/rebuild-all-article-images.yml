name: Rebuild all article images under current strict policy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebuild-all-article-images.yml'
      - 'automation/rebuild_article_images_exact_product.py'
      - 'automation/image_prompt_policy.py'
      - 'automation/image_quality_gate.py'
      - 'automation/assets/**'
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

concurrency:
  group: article-content-pipeline
  cancel-in-progress: false

env:
  AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
  AGNES_API_BASE: ${{ vars.AGNES_API_BASE || 'https://apihub.agnes-ai.com/v1' }}
  AGNES_MODEL: ${{ vars.AGNES_MODEL || 'agnes-3.0-flash' }}
  IMAGE_API_KEY: ${{ secrets.IMAGE_API_KEY || secrets.AGNES_API_KEY }}
  IMAGE_ENDPOINT: ${{ vars.IMAGE_ENDPOINT || 'https://apihub.agnes-ai.com/v1/images/generations' }}
  IMAGE_MODEL: ${{ vars.IMAGE_MODEL || 'agnes-image-2.5-flash' }}
  IMAGE_WORKERS: '3'
  IMAGE_QA_ATTEMPTS: '8'
  IMAGE_QA_FAST_MODE: '0'
  IMAGE_REBUILD_POST_LIMIT: '1'

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Sync latest main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          git reset --hard origin/main
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install and validate
        run: |
          python -m pip install --disable-pip-version-check pillow
          test -n "$AGNES_API_KEY"
          python -m py_compile automation/article_content_queue.py automation/image_prompt_policy.py automation/image_quality_gate.py automation/rebuild_article_images_exact_product.py automation/compress_article_images.py automation/package_article_content_batches.py automation/render_article_queue_status.py
      - name: Rebuild next strict batch
        id: rebuild
        shell: bash
        run: |
          set +e
          mkdir -p artifacts/article-content-queue
          python automation/rebuild_article_images_exact_product.py 2>&1 | tee artifacts/article-content-queue/full-image-rebuild-v9.log
          rc=${PIPESTATUS[0]}
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Refresh optimized images, packages and dashboard
        if: always()
        run: |
          python automation/compress_article_images.py
          PACKAGE_BATCH_SIZE=50 python automation/package_article_content_batches.py
          python automation/translate_generated_articles.py --check-backlog || test "$?" -eq 2
          python automation/render_article_queue_status.py
      - name: Persist rebuilt state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          state_dir="$(mktemp -d)"
          cp -a artifacts/article-content-queue/. "$state_dir/"
          git fetch origin main
          git reset --hard origin/main
          rm -rf artifacts/article-content-queue
          mkdir -p artifacts/article-content-queue
          cp -a "$state_dir/." artifacts/article-content-queue/
          git add -f artifacts/article-content-queue/images/* 2>/dev/null || true
          git add -f artifacts/article-content-queue/items/*.json 2>/dev/null || true
          git add -f artifacts/article-content-queue/packages/*.zip 2>/dev/null || true
          git add -f artifacts/article-content-queue/full-image-rebuild-v9.log 2>/dev/null || true
          git add -A artifacts/article-content-queue
          if ! git diff --cached --quiet; then
            git commit -m 'Rebuild article images under strict v9 role-isolated policy [skip ci]'
            git push origin HEAD:main
          fi
      - name: Upload rebuild diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: strict-article-image-rebuild-${{ github.run_id }}
          path: artifacts/article-content-queue/
          retention-days: 30
      - name: Fail only after preserving partial progress
        if: steps.rebuild.outputs.exit_code != '0'
        run: exit 1
