name: Rewrite city posts with Agnes

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "audit = گزارش، rewrite = تولید SQL"
        required: true
        type: choice
        options: [audit, rewrite]
        default: audit
      dump_path:
        description: "مسیر SQL یا SQL.GZ"
        required: true
        default: "database/incoming/navaraby_wp569.sql.gz"
      post_types:
        description: "post typeهای شهری با کاما؛ خالی = تشخیص خودکار"
        required: false
        default: ""
      max_posts:
        description: "۰ = همه؛ برای تست ۳"
        required: true
        default: "0"
  push:
    branches: [main]
    paths:
      - "database/incoming/*.sql"
      - "database/incoming/*.sql.gz"
      - "automation/city-rewrite-trigger.txt"

permissions:
  contents: write

concurrency:
  group: navar-city-post-rewrite
  cancel-in-progress: false

env:
  DUMP_PATH: database/incoming/navaraby_wp569.sql.gz
  RUN_MODE: audit
  POST_TYPES: ""
  MAX_POSTS: "0"
  AGNES_API_BASE: https://apihub.agnes-ai.com/v1
  AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
  AGNES_MODEL: agnes-2.5-flash

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Resolve workflow inputs
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "DUMP_PATH=${{ inputs.dump_path }}" >> "$GITHUB_ENV"
            echo "RUN_MODE=${{ inputs.mode }}" >> "$GITHUB_ENV"
            echo "POST_TYPES=${{ inputs.post_types }}" >> "$GITHUB_ENV"
            echo "MAX_POSTS=${{ inputs.max_posts }}" >> "$GITHUB_ENV"
          else
            TRIGGER_MODE="$(sed -n 's/^mode=//p' automation/city-rewrite-trigger.txt | tail -1)"
            TRIGGER_MAX_POSTS="$(sed -n 's/^max_posts=//p' automation/city-rewrite-trigger.txt | tail -1)"
            TRIGGER_POST_TYPES="$(sed -n 's/^post_types=//p' automation/city-rewrite-trigger.txt | tail -1)"
            TRIGGER_DUMP_PATH="$(sed -n 's/^dump_path=//p' automation/city-rewrite-trigger.txt | tail -1)"
            echo "DUMP_PATH=${TRIGGER_DUMP_PATH:-database/incoming/navaraby_wp569.sql.gz}" >> "$GITHUB_ENV"
            echo "RUN_MODE=${TRIGGER_MODE:-audit}" >> "$GITHUB_ENV"
            echo "POST_TYPES=$TRIGGER_POST_TYPES" >> "$GITHUB_ENV"
            echo "MAX_POSTS=${TRIGGER_MAX_POSTS:-0}" >> "$GITHUB_ENV"
          fi
      - name: Validate pipeline and dump
        run: |
          python -m py_compile automation/rewrite_city_posts.py
          test -f "$DUMP_PATH" || { echo "::error::Dump not found: $DUMP_PATH"; exit 1; }
      - name: Audit city posts
        run: |
          python automation/rewrite_city_posts.py audit --dump "$DUMP_PATH" --post-types "$POST_TYPES" --out artifacts/city-posts
      - name: Verify Agnes configuration
        if: env.RUN_MODE == 'rewrite'
        run: test -n "$AGNES_API_KEY" || { echo "::error::AGNES_API_KEY is missing"; exit 1; }
      - name: Rewrite and generate migrations
        if: env.RUN_MODE == 'rewrite'
        run: |
          python automation/rewrite_city_posts.py rewrite --dump "$DUMP_PATH" --post-types "$POST_TYPES" --max-posts "$MAX_POSTS" --out artifacts/city-posts
      - name: Publish three-post sample results
        if: env.RUN_MODE == 'rewrite' && env.MAX_POSTS == '3'
        run: |
          mkdir -p artifacts/city-posts-sample
          cp artifacts/city-posts/inventory.csv artifacts/city-posts/audit.json artifacts/city-posts/rewrite.sql artifacts/city-posts/rollback.sql artifacts/city-posts/rewrite-report.json artifacts/city-posts-sample/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f artifacts/city-posts-sample
          git commit -m "Publish three rewritten city post samples"
          git pull --rebase origin main
          git push origin main
      - name: Commit review package to git
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f artifacts/city-posts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish city post rewrite review package"
          git pull --rebase origin main
          git push origin main
